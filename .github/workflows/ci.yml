name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tesseract (overlay calibration OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      # The range detector is private and absent here: its tests skip, everything
      # else (MCP protocol, bars, overlay calibration) runs. Network tests are
      # deselected by default (-m 'not live').
      - name: Pytest
        run: pytest -rs
